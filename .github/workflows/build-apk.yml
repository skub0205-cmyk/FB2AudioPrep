
name: Build FB2AudioPrep APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q "FB2AudioPrep-1.9.0-cloud-build(1).zip" -d /tmp/fb2src
          cp -a /tmp/fb2src/FB2AudioPrep-1.9.0/. .

      - name: Inspect book import flow before fixes
        run: |
          echo '--- MainActivity book import handlers ---'
          grep -n -E 'openBook|onActivityResult|ActivityResult|GetContent|OpenDocument|originalText|processedText|contentResolver' app/src/main/java/ru/fbaudioprep/MainActivity.kt || true
          echo '--- MainActivity source (first 320 lines) ---'
          sed -n '1,320p' app/src/main/java/ru/fbaudioprep/MainActivity.kt

      - name: Upload source files for import-flow inspection
        uses: actions/upload-artifact@v4
        with:
          name: FB2AudioPrep-source-inspection
          path: |
            app/src/main/java/ru/fbaudioprep/
            app/src/main/AndroidManifest.xml
            app/build.gradle.kts
          if-no-files-found: error

      - name: Apply FB2AudioPrep 2.0.0 fixes
        run: python3 patches/apply_v2_patch.py

      - name: Apply FB2AudioPrep 2.0.1 full-screen reader UI
        run: python3 patches/apply_v3_patch.py

      - name: Apply FB2AudioPrep reader UX refresh
        run: python3 patches/apply_v4_reader_ux.py

      - name: Add Russian voice engine contracts
        run: python3 patches/apply_v5_russian_voice_contracts.py

      - name: Add Russian voice audition catalog
        run: python3 patches/apply_v6_russian_voice_candidates.py

      - name: Add local voice sample capture
        run: python3 patches/apply_v7_voice_sample_capture.py

      - name: Add verified offline model installer
        run: python3 patches/apply_v8_verified_model_installer.py

      - name: Add automatic Russian dialogue attribution analyzer
        run: python3 patches/apply_v9_dialogue_analyzer.py

      - name: Fix asynchronous book import and large-book reader handoff
        run: python3 patches/apply_v10_import_reliability.py

      - name: Configure Java and Kotlin JVM target
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF
          
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FB2AudioPrep-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
