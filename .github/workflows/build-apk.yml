
name: Build FB2AudioPrep APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q "FB2AudioPrep-1.9.0-cloud-build(1).zip" -d /tmp/fb2src
          cp -a /tmp/fb2src/FB2AudioPrep-1.9.0/. .

      - name: Inspect book import flow before fixes
        run: |
          echo '--- MainActivity book import handlers ---'
          grep -n -E 'openBook|onActivityResult|ActivityResult|GetContent|OpenDocument|originalText|processedText|contentResolver' app/src/main/java/ru/fbaudioprep/MainActivity.kt || true
          echo '--- MainActivity source (first 320 lines) ---'
          sed -n '1,320p' app/src/main/java/ru/fbaudioprep/MainActivity.kt

      - name: Upload source files for import-flow inspection
        uses: actions/upload-artifact@v4
        with:
          name: FB2AudioPrep-source-inspection
          path: |
            app/src/main/java/ru/fbaudioprep/
            app/src/main/AndroidManifest.xml
            app/build.gradle.kts
          if-no-files-found: error

      - name: Apply FB2AudioPrep 2.0.0 fixes
        run: python3 patches/apply_v2_patch.py

      - name: Apply FB2AudioPrep 2.0.1 full-screen reader UI
        run: python3 patches/apply_v3_patch.py

      - name: Apply FB2AudioPrep reader UX refresh
        run: python3 patches/apply_v4_reader_ux.py

      - name: Add Russian voice engine contracts
        run: python3 patches/apply_v5_russian_voice_contracts.py

      - name: Add Russian voice audition catalog
        run: python3 patches/apply_v6_russian_voice_candidates.py

      - name: Add local voice sample capture
        run: python3 patches/apply_v7_voice_sample_capture.py

      - name: Add verified offline model installer
        run: python3 patches/apply_v8_verified_model_installer.py

      - name: Add automatic Russian dialogue attribution analyzer
        run: python3 patches/apply_v9_dialogue_analyzer.py

      - name: Fix asynchronous book import and large-book reader handoff
        run: python3 patches/apply_v10_import_reliability.py

      - name: Improve dialogue attribution and add regression tests
        run: python3 patches/apply_v11_dialogue_regressions.py

      - name: Add visible dialogue browser and review without profiles
        run: python3 patches/apply_v12_dialogue_browser_ui.py

      - name: Improve dialogue detection and allow creating speakers from review
        run: python3 patches/apply_v13_dialogue_detection_and_assignment.py

      - name: Make dialogue speaker assignment explicit and confirm it
        run: python3 patches/apply_v14_dialogue_assignment_feedback.py

      - name: Fix dialogue dialog dismissal sequencing
        run: python3 patches/apply_v15_dialogue_dialog_lifecycle.py
      - name: Add offline ONNX neural speaker ranker runtime
        run: python3 patches/apply_v16_neural_speaker_runtime.py
      - name: Add automatic character discovery and neural attribution
        run: python3 patches/apply_v17_automatic_speaker_pipeline.py
      - name: Run automatic dialogue analysis in background
        run: python3 patches/apply_v18_background_dialogue_analysis.py
      # Keep the dormant CSN adapter source for binary compatibility; m10b is the active path.
      - name: Integrate TeraTTS 1.59 RuModernBERT m10b role model
        run: python3 patches/apply_v19_teratts_m10b_integration.py

      - name: Add real model download and dialogue analysis progress indicators
        run: python3 patches/apply_v20_progress_indicators.py

      - name: Speed up explicit dialogue analysis without changing background TTS priority
        run: python3 patches/apply_v21_analysis_priority.py

      - name: Keep model installation separate from dialogue analysis
        run: python3 patches/apply_v22_separate_model_download.py

      - name: Configure Java and Kotlin JVM target
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF
          
      - name: Configure persistent APK signing
        env:
          FB2_KEYSTORE_BASE64: ${{ secrets.FB2_KEYSTORE_BASE64 }}
          FB2_KEYSTORE_PASSWORD: ${{ secrets.FB2_KEYSTORE_PASSWORD }}
          FB2_KEY_ALIAS: ${{ secrets.FB2_KEY_ALIAS }}
          FB2_KEY_PASSWORD: ${{ secrets.FB2_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in FB2_KEYSTORE_BASE64 FB2_KEYSTORE_PASSWORD FB2_KEY_ALIAS FB2_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          echo "$FB2_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fb2audioprep-signing.jks"
          chmod 600 "$RUNNER_TEMP/fb2audioprep-signing.jks"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("versionCode = 20", 'versionCode = 20 + System.getenv("GITHUB_RUN_NUMBER").toInt()')
          p.write_text(s)
          PY
          cat >> app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  create("stable") {
                      storeFile = file(System.getenv("FB2_KEYSTORE_PATH"))
                      storePassword = System.getenv("FB2_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("FB2_KEY_ALIAS")
                      keyPassword = System.getenv("FB2_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("stable")
                  }
              }
          }
          EOF
        env:
          FB2_KEYSTORE_PATH: ${{ runner.temp }}/fb2audioprep-signing.jks

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run dialogue regression tests and build APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FB2AudioPrep-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
